# Runs the checks on every push and pull request, on a fresh Linux machine in the cloud.
# If any step fails, GitHub shows a red X on the commit/PR instead of a green check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the exact locked environment (CPU-only PyTorch on Linux)
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Run tests
        run: uv run pytest -q
